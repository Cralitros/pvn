<div class="grid-container">
  <h1 class="mat-h1">📊 TOTAL DE REGISTROS</h1>
  <h2 class="section-title">Maestros y Gestión</h2>

  <div class="cards-grid">
    <mat-card class="stat-card" *ngFor="let valor of valores; let i = index">
      <mat-card-content class="stat-content">
        <div class="stat-icon">
          <mat-icon>{{ getIcon(maestros[i]) }}</mat-icon>
        </div>
        <div class="stat-info">
          <p class="stat-label">{{ maestros[i] | titlecase }}</p>
          <p class="stat-value">{{ valor }}</p>
          <p class="stat-desc">registros</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
