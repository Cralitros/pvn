<!-- Barra de herramientas horizontal -->
<div class="toolbar">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Buscar...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <mat-checkbox (change)="toggleFilter($event)" class="filter-checkbox">
    Activar Filtro
  </mat-checkbox>

  <button mat-icon-button (click)="toggleFilterMenu($event)" *ngIf="isFilterEnabled" matTooltip="Filtros avanzados">
    <mat-icon>filter_list</mat-icon>
  </button>

  <span class="spacer"></span>

  <button mat-stroked-button color="primary" (click)="reporte()" class="toolbar-btn">
    <mat-icon>assessment</mat-icon>
    Reporte
  </button>

  <button mat-stroked-button color="accent" (click)="exportToExcel()" class="toolbar-btn">
    <mat-icon>file_download</mat-icon>
    Exportar a Excel
  </button>

  <!-- Sin `color="warn"`: con la paleta roja de avisos, un botón de refrescar en
       rojo se lee como una acción peligrosa. Queda neutro, entre el azul del
       reporte y el verde de la exportación. -->
  <button mat-stroked-button (click)="refresh()" class="toolbar-btn">
    <mat-icon>refresh</mat-icon>
    Refrescar
  </button>
</div>

<div class="filter-menu" *ngIf="filterMenuVisible" [ngStyle]="{'top.px': menuPosition.y, 'left.px': menuPosition.x}">
  <app-filtro [columns]="columns" (filterg)="dataGenerada($event)"></app-filtro>

<!-- Tabla -->
<div class="table-container">
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2" multiTemplateDataRows>

      <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ column.header }}
        </th>
        <!-- `cssClass` es una propiedad de la columna que hasta ahora no se
             aplicaba en ningún sitio: la columna de grado declaraba
             `pre-formatted` para que se respetaran sus saltos de línea y no
             servía de nada. -->
        <td mat-cell *matCellDef="let element" [ngClass]="column.cssClass">
          <ng-container *ngIf="column.isAction; else normalCell">
            <div class="buttons">
              <button mat-icon-button color="primary" (click)="editElement(element)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteElement(element)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
              <button mat-icon-button [matMenuTriggerFor]="moreMenu" matTooltip="Más opciones">
                <mat-icon>more_vert</mat-icon>
              </button>
            </div>
          </ng-container>

          <!-- El valor va dentro de un bloque con recorte: un `max-width`
               puesto directamente en la celda lo ignora el algoritmo de las
               tablas. El texto completo permanece en el DOM y se lee entero en
               la fila desplegada. -->
          <ng-template #normalCell>
            <span class="celda-texto">{{ datos(column.cell(element), column) }}</span>
          </ng-template>
        </td>
      </ng-container>

      <!-- Botón que despliega el detalle. No lleva manejador propio: el clic de
           la fila ya despliega, así que este botón solo lo propaga. Se mantiene
           como botón para que la fila se pueda abrir con el teclado y para que
           se vea que hay algo desplegable. -->
      <ng-container matColumnDef="expandir">
        <th mat-header-cell *matHeaderCellDef class="col-expandir"></th>
        <td mat-cell *matCellDef="let element" class="col-expandir">
          <button type="button" mat-icon-button [attr.aria-expanded]="isRowExpanded(element)"
            [matTooltip]="isRowExpanded(element) ? 'Ocultar detalle' : 'Ver todos los campos'">
            <mat-icon [class.girada]="isRowExpanded(element)">expand_more</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Fila desplegable: repite todos los campos con espacio para leerlos
           enteros, que es donde no caben en la celda. La fila de datos NO lleva
           esta columna: si la llevara, renderizaría su propia copia del panel y
           al desplegar crecería con el contenido duplicado. -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="columnasCabecera.length"
          class="celda-detalle">
          <div class="detalle" [@detailExpand]="isRowExpanded(element) ? 'expanded' : 'collapsed'">
            <div class="detalle__campos">
              <div class="detalle__campo" *ngFor="let column of columnasDetalle">
                <span class="detalle__etiqueta">{{ column.header }}</span>
                <span class="detalle__valor">{{ datos(column.cell(element), column) }}</span>
              </div>
            </div>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasCabecera"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasCabecera;"
        [class.selected-row]="isRowSelected(row)" [class.highlighted-row]="isRowHighlighted(row)"
        [class.fila-abierta]="isRowExpanded(row)" [class.example-element-row]="true"
        (click)="dataCliked(row, $event)" (dblclick)="dataClickedData(row)"
        (contextmenu)="clkderecho(row, $event)">
      </tr>
      <!-- Una fila de detalle por registro: con `multiTemplateDataRows` se
           intercala debajo de su fila y solo ocupa altura cuando está abierta. -->
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="fila-detalle"></tr>
    </table>
  </div>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>

<!-- Menú de tres puntos -->
<mat-menu #moreMenu="matMenu">
  <button mat-menu-item (click)="llamarPDF(selectedRow)">
    <mat-icon>picture_as_pdf</mat-icon>
    <span>Constancia</span>
  </button>
  <button mat-menu-item (click)="firma(selectedRow)">
    <mat-icon>picture_as_pdf</mat-icon>
    <span>Firma</span>
  </button>
</mat-menu>

<!-- Menú contextual (clic derecho) -->
<div *ngIf="selectedRow && dpintar" class="menu" [ngStyle]="{'top.px': menuPosition.y, 'left.px': menuPosition.x}">
  <button class="btncss" mat-button (click)="editElement(selectedRow)">Editar</button>
  <button class="btncss" mat-button (click)="deleteElement(selectedRow)">Eliminar</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'laboral')">Laboral</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button (click)="mover(selectedRow.codigo, 'grado')">Grado</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'categoria')">Categoria</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'investigador')">Investigación</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'cursoDocentes')">Cursos</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button (click)="mover(selectedRow.codigo, 'infoDocentes')">Info.
    Docentes</button>
  <button class="btncss" *ngIf="tipo=='maestros'" mat-button (click)="mover(selectedRow.dni, 'firma')">Firma</button>
  <button class="btncss" mat-button (click)="cerrar()">Cerrar</button>
</div>
