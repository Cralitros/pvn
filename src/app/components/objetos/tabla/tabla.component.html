<!-- Barra de herramientas horizontal -->
<div class="toolbar">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Buscar...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <mat-checkbox (change)="toggleFilter($event)" class="filter-checkbox">
    Activar Filtro
  </mat-checkbox>

  <button mat-icon-button (click)="toggleFilterMenu($event)" *ngIf="isFilterEnabled" matTooltip="Filtros avanzados">
    <mat-icon>filter_list</mat-icon>
  </button>

  <span class="spacer"></span>

  <button mat-stroked-button color="primary" (click)="reporte()" class="toolbar-btn">
    <mat-icon>assessment</mat-icon>
    Reporte
  </button>

  <button mat-stroked-button color="accent" (click)="exportToExcel()" class="toolbar-btn">
    <mat-icon>file_download</mat-icon>
    Exportar a Excel
  </button>

  <button mat-stroked-button color="warn" (click)="refresh()" class="toolbar-btn">
    <mat-icon>refresh</mat-icon>
    Refrescar
  </button>
</div>

<!-- Menú de filtros avanzados -->
<div class="filter-menu" *ngIf="filterMenuVisible" [ngStyle]="{'top.px': menuPosition.y, 'left.px': menuPosition.x}">
  <app-filtro [columns]="columns" (filterg)="dataGenerada($event)"></app-filtro>
</div>
<!-- Tabla -->
<div class="table-container">
  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

      <ng-container *ngFor="let column of columns" [matColumnDef]="column.columnDef">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let element">
          <ng-container *ngIf="column.isAction; else normalCell">
            <div class="buttons">
              <button mat-icon-button color="primary" (click)="editElement(element)" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteElement(element)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
              <button mat-icon-button [matMenuTriggerFor]="moreMenu" matTooltip="Más opciones">
                <mat-icon>more_vert</mat-icon>
              </button>
            </div>
          </ng-container>

          <ng-template #normalCell>
            {{ datos(column.cell(element), column) }}
          </ng-template>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.selected-row]="isRowSelected(row)"
        [class.highlighted-row]="isRowHighlighted(row)" [class.example-element-row]="true"
        (click)="dataCliked(row, $event)" (dblclick)="dataClickedData(row)" (contextmenu)="clkderecho(row, $event)">
      </tr>
    </table>
  </div>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons></mat-paginator>

<!-- Menú de tres puntos -->
<mat-menu #moreMenu="matMenu">
  <button mat-menu-item (click)="llamarPDF(selectedRow)">
    <mat-icon>picture_as_pdf</mat-icon>
    <span>Constancia</span>
  </button>
  <button mat-menu-item (click)="firma(selectedRow)">
    <mat-icon>picture_as_pdf</mat-icon>
    <span>Firma</span>
  </button>
</mat-menu>

<!-- Menú contextual (clic derecho) -->
<div *ngIf="selectedRow && dpintar" class="menu" [ngStyle]="{'top.px': menuPosition.y, 'left.px': menuPosition.x}">
  <button class="btncss" mat-button (click)="editElement(selectedRow)">Editar</button>
  <button class="btncss" mat-button (click)="deleteElement(selectedRow)">Eliminar</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'laboral')">Laboral</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button (click)="mover(selectedRow.codigo, 'grado')">Grado</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'categoria')">Categoria</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'investigador')">Investigación</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button
    (click)="mover(selectedRow.codigo, 'cursoDocentes')">Cursos</button>
  <button class="btncss" *ngIf="tipo=='docentes'" mat-button (click)="mover(selectedRow.codigo, 'infoDocentes')">Info.
    Docentes</button>
  <button class="btncss" *ngIf="tipo=='maestros'" mat-button (click)="mover(selectedRow.dni, 'firma')">Firma</button>
  <button class="btncss" mat-button (click)="cerrar()">Cerrar</button>
</div>
