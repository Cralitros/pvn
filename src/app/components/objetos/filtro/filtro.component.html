<div class="filter-container">
  <div *ngFor="let filter of filters; let i = index" class="filter-row">
    <mat-form-field appearance="outline">
      <mat-label>Seleccione columna</mat-label>
      <mat-select [(ngModel)]="filter.column">
        <mat-option *ngFor="let item of columns" [value]="item.columnDef">
          {{item.header}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filtro</mat-label>
      <input matInput [(ngModel)]="filter.filter" placeholder="Ingrese filtro">
    </mat-form-field>

    <button mat-icon-button (click)="filters.splice(i, 1)" matTooltip="Eliminar filtro">
      <mat-icon>remove_circle</mat-icon>
    </button>
  </div>

  <div class="filter-actions">
    <button mat-icon-button color="primary" (click)="addFilter()" matTooltip="Agregar otro filtro">
      <mat-icon>add_circle</mat-icon>
    </button>

    <button mat-icon-button color="accent" (click)="aceptarFiltro()" matTooltip="Aplicar filtros">
      <mat-icon>check</mat-icon>
    </button>

    <button mat-icon-button color="warn" (click)="cancelarrFiltro()" matTooltip="Cancelar filtros">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
