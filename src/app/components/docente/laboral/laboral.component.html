<form [formGroup]="formulario">
    <mat-form-field class="example-full-width">
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" placeholder="Código">
    </mat-form-field>
</form>
<button class="button-add" mat-raised-button color="primary" type="submit" (click)="dialogo()"> Añadir Campo Laboral de Docente</button>
<div class="contenedortabla">
    <app-tabla class="tabla" [columns]="columns" [dataSource]="dataSource" (edit)="editar($event)"
        (delete)="eliminar($event)"></app-tabla>
</div>
