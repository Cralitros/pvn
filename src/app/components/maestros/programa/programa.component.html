<div class="laboral-wrapper">
    <!-- Botón -->

    <button mat-raised-button class="button-add" type="submit" (click)="dialogo()"> Añadir Escuela y/o Programa</button>

    <!-- Tabla -->
    <div class="contenedortabla">
        <app-tabla class="tabla" [columns]="columns" [report]="tipo" [dataSource]="dataSource" (edit)="editar($event)"
        [tipo]="'programaacad'" 
            (delete)="eliminar($event)" (refreshTable)="cargartabla()"></app-tabla>
    </div>
</div>
