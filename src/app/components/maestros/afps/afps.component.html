<div class="laboral-wrapper">
    <!-- Botón -->
   
    <button mat-raised-button class="button-add" type="submit" (click)="dialogo()"> Añadir AFP</button>

    <!-- Tabla -->
    <div class="contenedortabla">
    <app-tabla class="tabla"
    [columns]="columns" 
    [dataSource]="dataSource"
    [report]="tipo"
    (edit)="editar($event)" 
    (delete)="eliminar($event)"
    (refreshTable)="cargartabla()"
   ></app-tabla>

</div>
