<div class="dialog-container" [formGroup]="formulario">
  <!-- Título con barra de acento -->
  <div class="dialog-title">
    <span class="title-accent"></span>
    <span>{{ funcion }} Área</span>
  </div>

  <!-- Formulario con scroll interno si fuera necesario -->
  <div class="tab-form">
    <div class="form-section">
      <span class="section-title">Información del Área</span>
      
      <div class="grid-2">
        <mat-form-field appearance="outline">
          <mat-label>ID</mat-label>
          <input matInput formControlName="id" placeholder="Identificador" readonly>
        </mat-form-field>
        
        <mat-form-field appearance="outline">
          <mat-label>Nombre del Área *</mat-label>
          <input matInput formControlName="nombre" placeholder="Ingrese nombre del área">
          <mat-error>El nombre es requerido.</mat-error>
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Barra de acciones inferior -->
  <div class="dialog-actions">
    <div class="actions-left"></div>
    <div class="actions-right">
      <button mat-button (click)="onNoClick()">Cancelar</button>
      <button mat-raised-button color="primary" (click)="onSubmit()" class="btn-nav">
        {{ funcion }}
      </button>
    </div>
  </div>
</div>
