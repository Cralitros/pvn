<div class="dialog-container" [formGroup]="formulario">
  <div class="dialog-title">
    <span class="title-accent"></span>
    <span>{{ funcion }} AFP</span>
  </div>

  <div class="tab-form">
    <!-- Sección: Datos de la AFP -->
    <div class="form-section">
      <span class="section-title">Datos de la AFP</span>
      
      <div class="grid-2">
        <mat-form-field appearance="outline" *ngIf="data.modo == 1">
          <mat-label>ID</mat-label>
          <input matInput formControlName="id" placeholder="ID" readonly>
          <mat-error *ngIf="formulario?.get('id')?.invalid && formulario?.get('id')?.touched">
            ID es requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" [class.full-width]="data.modo != 1">
          <mat-label>Nombre de la AFP</mat-label>
          <input matInput formControlName="nombre" placeholder="Ej: Prima AFP, Integra, etc.">
          <mat-error *ngIf="formulario?.get('nombre')?.invalid && formulario?.get('nombre')?.touched">
            El nombre de la AFP es requerido
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Barra de acciones -->
  <div class="dialog-actions">
    <div class="actions-left"></div>
    <div class="actions-right">
      <button mat-button (click)="onNoClick()">Cancelar</button>
      <button mat-raised-button color="primary" (click)="onSubmit()" class="btn-nav">
        {{ funcion }}
      </button>
    </div>
  </div>
</div>
