<form [formGroup]="formularioGrado" class="formulario">
    <div class="general">
        <div class="form">
            <mat-form-field class="example-full-width">
                <mat-label>Codigo docente</mat-label>
                <input matInput formControlName="codigoDocente" placeholder="Codigo docente">
            </mat-form-field>
        </div>

        <div class="form">
            <mat-form-field class="example-full-width nac">
                <mat-label>Grado</mat-label>
                <mat-select formControlName="grado">
                    <mat-option>Seleccionar grado</mat-option>
                    @for (grado of grados; track grado) {
                    <mat-option [value]="grado">{{grado}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
        <div class="form">
            <mat-form-field class="example-full-width">
                <mat-label>Profesión</mat-label>
                <input matInput formControlName="profesion" placeholder="Revalidado">
            </mat-form-field>
        </div>
        <div class="form">
            <mat-form-field class="example-full-width">
                <mat-label>Revalidado</mat-label>
                <input matInput formControlName="revalidado" placeholder="Revalidado">
            </mat-form-field>
        </div>
        <div class="form">
            <mat-form-field class="example-full-width">
                <mat-label>Lugar Obtencion</mat-label>
                <input matInput formControlName="lugar_obtencion" placeholder="Lugar obtencion">
            </mat-form-field>
        </div>


        <div class="form">
            <mat-form-field class="example-full-width calendario">
                <mat-label>Fecha obtencion grado/titulo</mat-label>
                <input matInput [matDatepicker]="picker2" formControlName="fecha_obtencion" (paste)="onPaste($event)">
                <mat-hint>DD/MM/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
                <mat-datepicker #picker2></mat-datepicker>
            </mat-form-field>

        </div>
        <div class="form tabla">
            <button mat-raised-button color="primary" (click)="agregarFila()">
                Agregar Fila
            </button>

            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
             

                <!-- Columna Select -->
                <ng-container matColumnDef="grado">
                    <th mat-header-cell *matHeaderCellDef> Grado </th>
                    <td mat-cell *matCellDef="let element; let i = index">
                        <select name="select">
                            <option *ngFor="let opcion of opcionesSelect" [value]="opcion.value"
                            [disabled]="opcion.disabled">
                            {{opcion.label}}</option>
                        </select>
                    </td>
                </ng-container>
                <ng-container matColumnDef="titulo">
                    <th mat-header-cell *matHeaderCellDef> Titulo </th>
                    <td mat-cell *matCellDef="let element">
                        <input type="text" name="Titulo" />
                    </td>
                </ng-container>

                <ng-container matColumnDef="fecha">
                    <th mat-header-cell *matHeaderCellDef> Fecha </th>
                    <td mat-cell *matCellDef="let element">
                        <input type="date" name="bday" />
                    </td>
                </ng-container>
                
                <ng-container matColumnDef="acciones">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="iconos">
                            <button class="db" (click)="eliminar(element)">
                                <mat-icon aria-hidden="false" aria-label="Example home icon"
                                    fontIcon="delete_forever"></mat-icon>
                            </button>
                            <button class="eb">
                                <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="edit"></mat-icon>
                            </button>

                        </div>
                    </td>
                </ng-container>

                <!-- Fila de encabezado -->
                <tr mat-header-row *matHeaderRowDef="columnas"></tr>
                <!-- Filas de datos -->
                <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
            </table>
        </div>
    </div>
    <button class="btn add-bnt-grado" mat-raised-button color="primary" type="submit"
        (click)="add_grado()">Agregar</button>
</form>
