<div class="p-4">
  <h2>Módulo de Firma</h2>

  <!-- Canvas -->
  <canvas #canvas></canvas>

  <div class="mt-2">
    <button (click)="clear()">Limpiar</button>
    <button (click)="save()">Guardar</button>
  </div>

  <!-- Subir firma -->
  <div class="mt-4">
    <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    <p *ngIf="fileName">Archivo cargado: {{ fileName }}</p>
  </div>

  <!-- Vista previa -->
  <div *ngIf="signatureImg" class="mt-4">
    <h3>Vista previa:</h3>
    <img [src]="signatureImg" alt="Firma" />
  </div>
</div>
